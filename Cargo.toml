[package]
name = "sqd-portal"
version = "0.13.2"
edition = "2021"
default-run = "sqd-portal"

[features]
sql = ["dep:once_cell", "dep:substrait", "dep:sql_query_plan"]

[dependencies]
anyhow = "1"
async-compression = { version = "0.4.20", features = ["tokio", "gzip"] }
async-stream = "0.3.5"
atomic_enum = { version = "0.3.0", features = ["cas"] }
axum = { version = "0.7", features = ["http2"] }
axum-extra = { version = "0.9", features = ["query"] }
base64 = "0.22"
utoipa = { version = "5", features = ["preserve_path_order"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }
bimap = "0.6.3"
bytes = "1.9"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dotenv = "0.15"
flate2 = "1.0.33"
futures = "0.3"
hex = "0.4"
hex-literal = "0.4.1"
# size_hint() on a response body: tells a framework rejection apart from a stream without
# polling it. Already in the tree via axum.
http-body = "1"
# ADR-015 fault classification; reqwest's error API can't see a pre-head connection death.
hyper = "1"
itertools = "0.12"
lazy_static = "1.4.0"
# Parses the signing key file directly, so it is never handed to a loader that
# would mint one instead. Already in the tree via libp2p.
libp2p-identity = { version = "0.2", features = ["ed25519"] }
libz-ng-sys = "1.1.23"
# Bounded grant cache: the working set is attacker-influenced, so it evicts
# rather than grows (DC-8, HZ-13).
lru = "0.12"
num-rational = "0.4"
num-traits = "0.2.19"
# The auth gate must read the dataset segment the way axum's `Path` extractor
# does, or the two disagree about which dataset a request names. Already in the
# tree via axum.
percent-encoding = "2"
once_cell = { version = "1.21", optional = true }
prometheus-client = "0.23"
prost = "0.13.4"
rand = "0.9.2"
reqwest = { version = "0.12.7", features = ["stream", "gzip", "json"] }
scopeguard = "1.2"
semver = "1"
sentry = { version = "0.46.0", features = ["tracing", "tower"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0"
serde_with = "3.11"
serde_yaml = "0.9"
sha2 = "0.10"
static_assertions = "1.1.0"
substrait = { version = "0.48.0", features = ["serde", "parse"], optional = true }
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tokio-util = "0.7.11"
tower = "0.5"
tower-http = { version = "0.6.1", features = ["cors", "decompression-gzip", "request-id", "trace"] }
tracing = { version = "0.1", features = ["async-await"] }
tracing-futures = { version = "0.2.5", features = ["tokio", "futures-03"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
reqwest-retry = "0.7"
reqwest-middleware = "0.4"

sqd-assignments = { git = "https://github.com/subsquid/sqd-network.git", rev = "339a0d7", features = ["reader"] }
sqd-contract-client = { git = "https://github.com/subsquid/sqd-network.git", rev = "e9a3434", version = "1.3.0" }
sqd-messages = { git = "https://github.com/subsquid/sqd-network.git", rev = "e9a3434", version = "2.1.0", features = ["semver", "bitstring"] }
sqd-network-transport = { git = "https://github.com/subsquid/sqd-network.git", rev = "e9a3434", version = "3.1.0", features = ["portal", "metrics"] }

sqd-primitives = { git = "https://github.com/subsquid/data.git", rev = "eaa9f86", features = ["serde"] }
sqd-query = { git = "https://github.com/subsquid/data.git", rev = "eaa9f86" }

sql_query_plan = { git = "https://github.com/subsquid/qplan.git", rev = "2e61b51", optional = true }

[dev-dependencies]
proptest = "1.4.0"
tower = { version = "0.5", features = ["util"] }
proptest_async = { version = "0.2.1", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tempfile = "3"
# Reading an assignment is all the portal does; building one is how a test states the shape it
# reads -- a gap between chunks has no other way to exist here.
sqd-assignments = { git = "https://github.com/subsquid/sqd-network.git", rev = "339a0d7", features = ["builder", "reader"] }

# Keep this table to what is genuinely platform-specific -- jemalloc, which has no msvc build.
# Anything appended below the header is silently gated too, which is how the sqd-* crates ended
# up here and made an msvc build fail on missing crates rather than on missing jemalloc.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
